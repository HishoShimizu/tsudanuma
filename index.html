    <h2>駅から歩いて、街を楽しもう</h2>
    <p>津田沼駅の周辺には、買い物の途中や休日に立ち寄れる散歩スポットがあります。このサイトでは、公園や神社など、街を歩きながら楽しめる３つの場所を紹介します。</p>
    <p><span class="point">駅前から少し足をのばす</span>と、普段とは違う景色に出会えます。気になる場所を選んで、それぞれの紹介ページを見てみてください。</p>
    <h2>紹介する３つの場所</h2>
