    <h2>南口側で気軽に立ち寄る</h2>
    <p>津田沼公園は、JR津田沼駅の南口側にある公園です。駅前の街並みを眺めながら、散歩の途中に立ち寄る場所として紹介します。</p>
    <p><span class="point">駅の近くで散歩を楽しみたい人</span>におすすめです。周辺を歩きながら、街路樹や空の様子にも目を向けてみましょう。</p>
    <h2>散歩の楽しみ方</h2>
    <p>南口側の街を歩くときの立ち寄り先にしてみてください。同じ場所でも、季節や時間帯によって景色の印象が変わります。</p>
