    <h2>少し足をのばして神社へ</h2>
    <p>菊田神社は、京成津田沼駅の近くにある神社です。JR津田沼駅前から少し足をのばして、街並みを眺めながら訪ねる散歩先として紹介します。</p>
    <p><span class="point">鳥居や境内の雰囲気を楽しむ</span>のが、この散歩のポイントです。建物や木々に目を向けながら、ゆっくり歩いてみましょう。</p>
    <h2>散歩の楽しみ方</h2>
    <p>参拝する人の迷惑にならないように、静かに過ごしましょう。写真を撮るときは、現地の案内を確認してください。</p>
